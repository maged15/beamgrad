name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time in seconds
        default: "3600"
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Build fuzzer (ASan + UBSan)
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DDBS_BUILD_FUZZER=ON -DDBS_ENABLE_SANITIZERS=ON \
            -DDBS_BUILD_TESTS=OFF -DDBS_BUILD_BENCHMARKS=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz --parallel
      - name: Fuzz
        run: |
          mkdir -p corpus crashes
          ./build-fuzz/dbs_fuzz corpus -max_total_time=${{ github.event.inputs.seconds || '3600' }} \
            -artifact_prefix=crashes/ -rss_limit_mb=4096
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/
