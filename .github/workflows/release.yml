# On a version tag: verify the tag matches VERSION, build and check the source
# distribution, and attach it to a GitHub release. Publishing to PyPI runs only
# when the repository variable PYPI_PUBLISH=true and PyPI trusted publishing is
# configured for this workflow (environment `pypi`).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag against VERSION
        run: |
          python scripts/check_version_metadata.py
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build twine "setuptools>=77" wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m build --sdist --no-isolation
          twine check dist/*
      - name: Smoke-test the sdist
        run: |
          python -m pip install --no-build-isolation "$(ls dist/*.tar.gz)[test]"
          cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/python/tests" -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  github-release:
    needs: sdist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: sdist
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
