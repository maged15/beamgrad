# On a version tag: verify the tag matches VERSION, build and check the source
# distribution, build the binary wheels (wheels.yml), and attach all of them to
# a GitHub release. Publishing to PyPI (the sdist only: the wheels carry local
# version labels, which PyPI rejects) runs only when the repository variable
# PYPI_PUBLISH=true and PyPI trusted publishing is configured for this workflow
# (environment `pypi`).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag against VERSION
        run: |
          python scripts/check_version_metadata.py
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build twine "setuptools>=77" wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m build --sdist --no-isolation
          twine check dist/*
      - name: Smoke-test the sdist
        run: |
          python -m pip install --no-build-isolation "$(ls dist/*.tar.gz)[test]"
          cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/python/tests" -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  wheels:
    needs: sdist
    uses: ./.github/workflows/wheels.yml

  github-release:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Before the downloads: checkout empties the workspace.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        run: |
          # The section of this version: from its "## X.Y.Z" heading to the next "## ".
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          printf '\n## Installation\n\nPick the wheel for your platform, PyTorch version and CUDA variant from the assets below (see [docs/installation.md](https://github.com/%s/blob/%s/docs/installation.md)), or build from source against your PyTorch:\n\n```bash\npip install --no-build-isolation "git+https://github.com/%s@%s"\n```\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "beamgrad $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  pypi:
    needs: sdist
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
