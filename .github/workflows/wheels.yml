# Binary wheels. The compiled operators work only with the PyTorch minor
# version they were built against, but not with a particular Python: they use
# CPython's limited API, so each wheel is cp310-abi3 and serves Python 3.10+.
# One wheel per platform, PyTorch minor version and CUDA variant; each
# requires its PyTorch (torch==2.14.*) and names it in a local version label
# (2.0.0+pt214cu126). PyPI does not accept local versions, so the Release
# workflow attaches these to the GitHub release; PyPI gets the sdist.
name: Wheels

on:
  workflow_dispatch:
  workflow_call:
  # Pull requests that change how the wheels are built.
  pull_request:
    paths:
      - setup.py
      - pyproject.toml
      - "python/csrc/**"
      - .github/workflows/wheels.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux / torch ${{ matrix.torch }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # PyTorch minor versions (keep in sync with docs/installation.md and the job below).
        torch: ["2.13", "2.14"]
        variant: [cpu, cu126, cu130]
        include:
          # glibc 2.28 (manylinux_2_28 / RHEL 8) base images, so the wheels
          # run on any distribution PyTorch itself supports.
          - variant: cpu
            image: quay.io/pypa/manylinux_2_28_x86_64
          - variant: cu126
            image: nvidia/cuda:12.6.3-devel-rockylinux8
            arch: "7.5;8.0;8.6;8.9;9.0+PTX"
          - variant: cu130
            image: nvidia/cuda:13.0.3-devel-rockylinux8
            arch: "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"
    steps:
      - name: Toolchain
        run: |
          if [ "${{ matrix.variant }}" != cpu ]; then
            dnf install -y git gcc-toolset-13
            echo /opt/rh/gcc-toolset-13/root/usr/bin >> "$GITHUB_PATH"
          fi
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
      - uses: actions/checkout@v7
      - name: Build
        env:
          BEAMGRAD_CUDA: ${{ matrix.variant == 'cpu' && '0' || '1' }}
          BEAMGRAD_PIN_TORCH: "1"
          TORCH_CUDA_ARCH_LIST: ${{ matrix.arch }}
          MAX_JOBS: "4"
        run: |
          export BEAMGRAD_LOCAL_VERSION="pt$(echo ${{ matrix.torch }} | tr -d .)${{ matrix.variant }}"
          uv venv -p 3.12 /opt/build
          . /opt/build/bin/activate
          uv pip install "torch==${{ matrix.torch }}.*" --index-url https://download.pytorch.org/whl/${{ matrix.variant }}
          uv pip install setuptools wheel ninja pytest numpy
          uv build --wheel --no-build-isolation -o wheelhouse .
          uvx abi3audit --strict wheelhouse/*.whl
          ls -l wheelhouse
      - name: Test with the build interpreter
        run: |
          . /opt/build/bin/activate
          uv pip install wheelhouse/*.whl
          cd /tmp
          python -c "import beamgrad, torch; print(beamgrad.__version__, torch.__version__)"
          if [ "${{ matrix.variant }}" != cpu ]; then
            python -c "import beamgrad._C_cuda as m; print('CUDA operators, max beam', m.max_beam_size())"
          fi
          python -m pytest "$GITHUB_WORKSPACE/python/tests" -q
      - name: Test on the oldest and newest Python (abi3)
        if: matrix.variant == 'cpu'
        run: |
          for py in 3.10 3.13; do
            uv venv -p $py /opt/test-$py
            . /opt/test-$py/bin/activate
            uv pip install "torch==${{ matrix.torch }}.*" --index-url https://download.pytorch.org/whl/cpu
            uv pip install wheelhouse/*.whl pytest numpy
            (cd /tmp && python -m pytest "$GITHUB_WORKSPACE/python/tests" -q)
            deactivate
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-torch${{ matrix.torch }}-${{ matrix.variant }}
          path: wheelhouse/*.whl

  macos-windows:
    name: ${{ matrix.os }} / torch ${{ matrix.torch }} cpu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        torch: ["2.13", "2.14"]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install PyTorch
        shell: bash
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel ninja pytest numpy
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install "torch==${{ matrix.torch }}.*" --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install "torch==${{ matrix.torch }}.*"
          fi
          echo "BEAMGRAD_LOCAL_VERSION=pt$(echo ${{ matrix.torch }} | tr -d .)cpu" >> "$GITHUB_ENV"
      # Default shell (PowerShell on Windows): Git Bash would put its own
      # `link` ahead of MSVC's link.exe on PATH.
      - name: Build
        env:
          DISTUTILS_USE_SDK: "1"
          BEAMGRAD_CUDA: "0"
          BEAMGRAD_PIN_TORCH: "1"
        run: python -m pip wheel . --no-build-isolation --no-deps -w wheelhouse
      - name: Test
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/python/tests" -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-torch${{ matrix.torch }}-cpu
          path: wheelhouse/*.whl
